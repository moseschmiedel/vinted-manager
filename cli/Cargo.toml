[package]
name = "vinted"
version = "0.1.0"
edition = "2024"
description = "Vinted selling helper: inbox, price research, items, status, inventory"
publish = false

[dependencies]
anyhow = "1"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
ctrlc = { version = "3", features = ["termination"] }
dirs = "7"
regex = "1"
serde_json = { version = "1", features = ["preserve_order"] }
ureq = { version = "3", features = ["cookies"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
