name: Release macOS app

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Validate release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'Release tags must have the form vMAJOR.MINOR.PATCH.' >&2
            exit 1
          fi
          echo "APP_VERSION=${RELEASE_TAG#v}" >> "$GITHUB_ENV"
          echo "APP_BUILD=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
      # All Apple secrets set → signed and notarized release. None set → ad-hoc signed release.
      - name: Choose signed or unsigned release
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          SIGNING_IDENTITY: ${{ secrets.SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          missing=()
          for name in BUILD_CERTIFICATE_BASE64 P12_PASSWORD SIGNING_IDENTITY APPLE_ID APPLE_TEAM_ID APPLE_APP_SPECIFIC_PASSWORD; do
            if [ -z "${!name}" ]; then missing+=("$name"); fi
          done
          if [ "${#missing[@]}" -eq 0 ]; then
            echo "SIGNED=true" >> "$GITHUB_ENV"
          elif [ "${#missing[@]}" -eq 6 ]; then
            echo "::warning::No Apple signing secrets configured; publishing an ad-hoc signed release that is not notarized."
            echo "SIGNED=false" >> "$GITHUB_ENV"
          else
            echo "Missing repository secrets: ${missing[*]} (see app/README.md)." >&2
            exit 1
          fi
      - name: Prepare toolchains
        run: |
          xcodebuild -version
          swift --version
          rustup update stable --no-self-update
          rustup default stable
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Test CLI and app
        run: |
          cargo test --locked --manifest-path cli/Cargo.toml
          swift test --package-path app
      - name: Import signing certificate and notarization credentials
        if: env.SIGNED == 'true'
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          certificate="$RUNNER_TEMP/vinted-certificate.p12"
          keychain="$RUNNER_TEMP/vinted-signing.keychain-db"
          keychain_password="$(uuidgen)"
          echo "::add-mask::$keychain_password"
          printf '%s' "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 7200 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -P "$P12_PASSWORD" -t cert -f pkcs12 -k "$keychain" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" "$HOME/Library/Keychains/login.keychain-db"
          xcrun notarytool store-credentials vinted-notary --keychain "$keychain" \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD"
          echo "NOTARY_PROFILE=vinted-notary" >> "$GITHUB_ENV"
          echo "NOTARY_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          rm -f "$certificate"
      - name: Build, sign and notarize universal app
        if: env.SIGNED == 'true'
        env:
          ARCHS: arm64 x86_64
          SIGNING_IDENTITY: ${{ secrets.SIGNING_IDENTITY }}
        run: app/package-release.sh
      - name: Build ad-hoc signed universal app
        if: env.SIGNED != 'true'
        env:
          ARCHS: arm64 x86_64
          SIGNING_IDENTITY: '-'
        run: |
          app/build-app.sh
          ditto -c -k --keepParent "app/build/Vinted Manager.app" app/build/Vinted-Manager.zip
          cat > app/build/release-notes.md <<'NOTES'
          > [!WARNING]
          > This build is not notarized by Apple, so macOS blocks it on first launch. After unzipping,
          > move it to Applications and run `xattr -dr com.apple.quarantine "/Applications/Vinted Manager.app"`,
          > or try to open it once and then choose **Open Anyway** in System Settings › Privacy & Security.
          NOTES
      - name: Checksum
        run: |
          cd app/build
          shasum -a 256 Vinted-Manager.zip > Vinted-Manager.zip.sha256
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          notes=()
          if [ -f app/build/release-notes.md ]; then notes=(--notes-file app/build/release-notes.md); fi
          gh release create "$RELEASE_TAG" \
            app/build/Vinted-Manager.zip app/build/Vinted-Manager.zip.sha256 \
            --verify-tag --generate-notes "${notes[@]}" --title "Vinted Manager $RELEASE_TAG"
      - name: Clean up signing credentials
        if: always()
        run: |
          keychain="$RUNNER_TEMP/vinted-signing.keychain-db"
          if [ -f "$keychain" ]; then security delete-keychain "$keychain"; fi
          rm -f "$RUNNER_TEMP/vinted-certificate.p12"
