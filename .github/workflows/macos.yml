name: macOS build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            arch: arm64
            target: aarch64-apple-darwin
          - runner: macos-26-intel
            arch: x86_64
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Prepare toolchains
        env:
          RUST_TARGET: ${{ matrix.target }}
        run: |
          xcodebuild -version
          swift --version
          rustup update stable --no-self-update
          rustup default stable
          rustup target add "$RUST_TARGET"
      - name: Test CLI and app
        run: |
          cargo test --locked --manifest-path cli/Cargo.toml
          swift test --package-path app
      - name: Build test app
        env:
          ARCHS: ${{ matrix.arch }}
          SIGNING_IDENTITY: '-'
          APP_BUILD: ${{ github.run_number }}
        run: |
          app/build-app.sh
          ditto -c -k --keepParent "app/build/Vinted Manager.app" "app/build/Vinted-Manager-test-$ARCHS.zip"
      - name: Upload test app (ad-hoc signed)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Vinted-Manager-test-${{ matrix.arch }}
          path: app/build/Vinted-Manager-test-*.zip
          if-no-files-found: error
          retention-days: 14
